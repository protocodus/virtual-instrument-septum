name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DIST_ROOT: ${{ github.workspace }}/dist
  BUILD_NUMBER: ${{ github.run_id }}.${{ github.run_attempt }}

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests (Septum, JUCE-free, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake \
            -S "." \
            -B "build-dsp" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DSEPTUM_BUILD_PLUGIN=OFF" \
            -DBUILD_TESTING=ON

      - name: Build and test DSP engine
        run: |
          cmake --build "build-dsp" --parallel
          ctest --test-dir "build-dsp" --output-on-failure

      - name: Render and verify demo audio
        run: |
          set -euo pipefail
          cmake --build "build-dsp" --target "SeptumRenderDemos" --parallel
          "./build-dsp/SeptumRenderDemos" "Docs/audio"
          rendered=$(find "Docs/audio" -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 11 )); then
            echo "error: rendered $rendered demo WAVs, expected 11" >&2
            exit 1
          fi
          echo "Septum: rendered all $rendered demo WAVs"

      - name: Configure Linux plug-in build
        run: |
          cmake \
            -S "." \
            -B "build-dsp" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DSEPTUM_BUILD_PLUGIN=ON" \
            -DBUILD_TESTING=OFF

      - name: Build Linux VST3 and standalone
        run: |
          cmake --build "build-dsp" --parallel \
            --target "Septum_VST3" "Septum_Standalone"

      - name: Package Linux VST3 and standalone
        id: release
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=build-dsp bash scripts/package-linux.sh
          arch="x64"
          echo "version=$(python scripts/release_metadata.py --build-dir build-dsp --field version)" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "dist=$(python scripts/release_metadata.py --build-dir build-dsp --platform Linux --arch "$arch" --dist)" >> "$GITHUB_OUTPUT"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: Septum-${{ steps.release.outputs.version }}-build.${{ env.BUILD_NUMBER }}-Linux-${{ steps.release.outputs.arch }}
          path: ${{ steps.release.outputs.dist }}/*
          if-no-files-found: error
          retention-days: 7

  plugin-macos:
    name: Plug-in build (Septum, macOS native arch)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Clear any committed screenshot before rendering to ensure this build produces it
      - name: Clear screenshot before rendering
        run: rm -f "Docs/screenshots/septum-standalone.png"

      # Native-arch only keeps per-push CI fast. The local Xcode-based build
      # script defaults to universal arm64 + x86_64 output and runs the same tests.
      - name: Build plug-in and run tests
        env:
          BUILD_UNIVERSAL: "OFF"
          SEPTUM_EDITOR_SNAPSHOT: "${{ github.workspace }}/Docs/screenshots/septum-standalone.png"
        run: ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: |
          set -euo pipefail
          screenshot="Docs/screenshots/septum-standalone.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: Septum's suite did not render $screenshot" >&2
            echo "The suite must honour SEPTUM_EDITOR_SNAPSHOT." >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

      - name: Package macOS VST3, Audio Unit and standalone
        id: release
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/sign-and-package-macos.sh
          archs="$(lipo -archs build-macos/Septum_artefacts/Release/VST3/Septum.vst3/Contents/MacOS/Septum)"
          arch="x64"
          if [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]; then arch="universal"
          elif [[ "$archs" == *arm64* ]]; then arch="arm64"; fi
          echo "version=$(python scripts/release_metadata.py --build-dir build-macos --field version)" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "dist=$(python scripts/release_metadata.py --build-dir build-macos --platform macOS --arch "$arch" --dist)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: Septum-${{ steps.release.outputs.version }}-build.${{ env.BUILD_NUMBER }}-macOS-${{ steps.release.outputs.arch }}
          path: ${{ steps.release.outputs.dist }}/*
          if-no-files-found: error
          retention-days: 7

  dsp-tests-windows:
    name: DSP tests (Septum, JUCE-free, Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure DSP tests
        run: |
          cmake -S "." -B "build-win" -A x64 "-DSEPTUM_BUILD_PLUGIN=OFF" -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build and test DSP engine
        run: |
          cmake --build "build-win" --config Release --parallel
          ctest --test-dir "build-win" -C Release --output-on-failure

      - name: Configure Windows plug-in build
        run: |
          cmake -S "." -B "build-win" "-DSEPTUM_BUILD_PLUGIN=ON" -DBUILD_TESTING=OFF

      - name: Build Windows VST3 and standalone
        run: |
          cmake --build "build-win" --config Release --parallel --target "Septum_VST3" "Septum_Standalone"

      - name: Package Windows VST3 and standalone
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package-windows.py --build-dir build-win
          arch="x64"
          echo "version=$(python scripts/release_metadata.py --build-dir build-win --field version)" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "dist=$(python scripts/release_metadata.py --build-dir build-win --platform Windows --arch "$arch" --dist)" >> "$GITHUB_OUTPUT"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Septum-${{ steps.release.outputs.version }}-build.${{ env.BUILD_NUMBER }}-Windows-${{ steps.release.outputs.arch }}
          path: ${{ steps.release.outputs.dist }}/*
          if-no-files-found: error
          retention-days: 7
